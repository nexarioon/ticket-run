# ticket-run default policy.
# Copy to <repo>/.ticket-run.yaml or ~/.hermes/ticket-run.yaml to override.
language: en                       # message language: en | id
skills: [vdd-workflow, coding-plan, clean-code]
retention: regression-permanent     # regression-permanent | strict | keep-all
test_globs_allow: []               # e.g. ["tests/regression/**"]
